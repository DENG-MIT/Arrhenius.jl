units: {length: cm, time: s, quantity: mol, activation-energy: cal/mol}
phases:
- name: gas
  thermo: ideal-gas
  kinetics: gas
  elements: [H, O, Ar]
  species: all
  reactions: all
species:
- name: H
  composition: {H: 1}
  thermo: {model: NASA7, temperature-ranges: [200, 1000, 5000], data: [[2.5, 0, 0, 0, 0, 25473.66, -0.44668285], [2.5, 0, 0, 0, 0, 25473.66, -0.44668285]]}
- name: H2
  composition: {H: 2}
  thermo: {model: NASA7, temperature-ranges: [200, 1000, 5000], data: [[3.5, 0, 0, 0, 0, -1000, 2], [3.5, 0, 0, 0, 0, -1000, 2]]}
- name: O
  composition: {O: 1}
  thermo: {model: NASA7, temperature-ranges: [200, 1000, 5000], data: [[2.5, 0, 0, 0, 0, 29122.2592, 4.5], [2.5, 0, 0, 0, 0, 29122.2592, 4.5]]}
- name: O2
  composition: {O: 2}
  thermo: {model: NASA7, temperature-ranges: [200, 1000, 5000], data: [[3.5, 0, 0, 0, 0, -1000, 3], [3.5, 0, 0, 0, 0, -1000, 3]]}
- name: OH
  composition: {H: 1, O: 1}
  thermo: {model: NASA7, temperature-ranges: [200, 1000, 5000], data: [[3.5, 0, 0, 0, 0, 1000, 2], [3.5, 0, 0, 0, 0, 1000, 2]]}
- name: HO2
  composition: {H: 1, O: 2}
  thermo: {model: NASA7, temperature-ranges: [200, 1000, 5000], data: [[4, 0, 0, 0, 0, 1200, 3], [4, 0, 0, 0, 0, 1200, 3]]}
- name: H2O2
  composition: {H: 2, O: 2}
  thermo: {model: NASA7, temperature-ranges: [200, 1000, 5000], data: [[4, 0, 0, 0, 0, -2000, 4], [4, 0, 0, 0, 0, -2000, 4]]}
- name: Ar
  composition: {Ar: 1}
  thermo: {model: NASA7, temperature-ranges: [200, 1000, 5000], data: [[2.5, 0, 0, 0, 0, 0, 0], [2.5, 0, 0, 0, 0, 0, 0]]}
reactions:
- equation: H + O2 <=> HO2
  type: pressure-dependent-Arrhenius
  rate-constants:
  - {P: 0.1 atm, A: 1.0e12, b: 0, Ea: 0}
  - {P: 1 atm, A: 2.0e12, b: 0.1, Ea: 100}
- equation: H2 + O (+M) <=> H + OH (+M)
  type: linear-Burke
  colliders:
  - name: M
    type: pressure-dependent-Arrhenius
    rate-constants:
    - {P: 0.1 atm, A: 3.0e12, b: 0, Ea: 200}
    - {P: 1 atm, A: 4.0e12, b: 0.2, Ea: 300}
  - name: Ar
    efficiency: {A: 2.0, b: 0.1, Ea: 50}
- equation: H + O <=> OH
  type: Blowers-Masel
  rate-constant: {A: 1.0e10, b: 0.5, Ea0: 1000, w: 2500}
- equation: 2 OH (+M) <=> H2O2 (+M)
  type: falloff
  low-P-rate-constant: {A: 2.0e18, b: -1, Ea: 0}
  high-P-rate-constant: {A: 1.0e12, b: 0, Ea: 2000}
  Troe: {A: 0.5, T3: 1000, T1: 5000}



